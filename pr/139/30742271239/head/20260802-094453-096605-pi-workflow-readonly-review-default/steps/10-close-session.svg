<text x="18" y="38">Type workflow commands; use exit to close.</text>
<text x="18" y="58"></text>
<text x="18" y="78">pi&gt; scope repository</text>
<text x="18" y="98">user&gt; scope repository</text>
<text x="18" y="118">assistant&gt; Launching Pi in read-only review mode.</text>
<text x="18" y="138">assistant&gt; pi --tools read,grep,find,ls --no-session -p &quot;Review the repository.&quot;</text>
<text x="18" y="158">assistant&gt; write and edit tools are disabled for this run.</text>
<text x="18" y="178">assistant&gt; READONLY SCOPE READY</text>
<text x="18" y="198">inspect files</text>
<text x="18" y="218"></text>
<text x="18" y="238">pi&gt; user&gt; inspect files</text>
