<text x="18" y="38">Pi workflow: read-only repository review</text>
<text x="18" y="58">Type workflow commands; use exit to close.</text>
<text x="18" y="78"></text>
<text x="18" y="98">pi&gt; scope repository</text>
<text x="18" y="118">user&gt; scope repository</text>
<text x="18" y="138">assistant&gt; Launching Pi in read-only review mode.</text>
<text x="18" y="158">assistant&gt; pi --tools read,grep,find,ls --no-session -p &quot;Review the repository.&quot;</text>
<text x="18" y="178">assistant&gt; write and edit tools are disabled for this run.</text>
<text x="18" y="198">assistant&gt; READONLY SCOPE READY</text>
