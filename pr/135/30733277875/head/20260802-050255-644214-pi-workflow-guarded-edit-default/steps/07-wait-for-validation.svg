<style>text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3;white-space:pre}</style>
<text x="18" y="38">Pi workflow: guarded edit and validation</text>
<text x="18" y="58">Type workflow commands; use exit to close.</text>
<text x="18" y="78"></text>
<text x="18" y="98">pi&gt; propose change</text>
<text x="18" y="118">user&gt; propose change</text>
<text x="18" y="138">assistant&gt; Reading target files before editing.</text>
<text x="18" y="158">assistant&gt; tool allowlist: read,bash,edit,write.</text>
<text x="18" y="178">assistant&gt; proposing a small patch with isolated behavior.</text>
<text x="18" y="198">assistant&gt; GUARDED EDIT PLAN READY</text>
<text x="18" y="218">apply patch</text>
<text x="18" y="238"></text>
<text x="18" y="258">pi&gt; user&gt; apply patch</text>
<text x="18" y="278">assistant&gt; edit tool: applying patch.</text>
<text x="18" y="298">assistant&gt; changed files: recipe plus focused implementation.</text>
<text x="18" y="318">assistant&gt; patch applied.</text>
<text x="18" y="338">assistant&gt; GUARDED PATCH APPLIED</text>
<text x="18" y="358">validate tests</text>
<text x="18" y="378"></text>
<text x="18" y="398">pi&gt; user&gt; validate tests</text>
<text x="18" y="418">assistant&gt; bash&gt; uv run python -m unittest discover -s tests</text>
<text x="18" y="438">assistant&gt; 12 tests passed.</text>
<text x="18" y="458">assistant&gt; diff reviewed before final summary.</text>
<text x="18" y="478">assistant&gt; GUARDED VALIDATION COMPLETE</text>
</svg>
