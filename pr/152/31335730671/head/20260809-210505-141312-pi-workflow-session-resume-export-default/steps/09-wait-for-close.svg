<svg xmlns="http://www.w3.org/2000/svg" width="1026" height="596" viewBox="0 0 1026 596">
<rect width="100%" height="100%" fill="#101418"/>
<style>text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3;white-space:pre}</style>
<text x="18" y="38">Pi workflow: session resume, fork, and export</text>
<text x="18" y="58">Type workflow commands; use exit to close.</text>
<text x="18" y="78"></text>
<text x="18" y="98">pi&gt; start session</text>
<text x="18" y="118">user&gt; start session</text>
<text x="18" y="138">assistant&gt; pi --name &quot;Verifier workflow audit&quot; --session-dir .pi-sessions</text>
<text x="18" y="158">assistant&gt; session id: workflow-001.</text>
<text x="18" y="178">assistant&gt; SESSION STARTED</text>
<text x="18" y="198">continue session</text>
<text x="18" y="218"></text>
<text x="18" y="238">pi&gt; user&gt; continue session</text>
<text x="18" y="258">assistant&gt; pi --continue &quot;What did we verify?&quot;</text>
<text x="18" y="278">assistant&gt; pi --session workflow-001</text>
<text x="18" y="298">assistant&gt; previous context restored.</text>
<text x="18" y="318">assistant&gt; SESSION RESUMED</text>
<text x="18" y="338">fork export</text>
<text x="18" y="358"></text>
<text x="18" y="378">pi&gt; user&gt; fork export</text>
<text x="18" y="398">assistant&gt; pi --fork workflow-001 --name &quot;Workflow audit branch&quot;</text>
<text x="18" y="418">assistant&gt; pi --export session.jsonl output.html</text>
<text x="18" y="438">assistant&gt; exported review artifact for handoff.</text>
<text x="18" y="458">assistant&gt; SESSION RESUME EXPORT COMPLETE</text>
<text x="18" y="478">exit</text>
<text x="18" y="498"></text>
<text x="18" y="518">pi&gt; assistant&gt; Closing Pi workflow demonstration.</text>
<text x="18" y="538">WORKFLOW SESSION COMPLETE</text>
</svg>
