<text x="18" y="38">assistant&gt; Launching Pi in read-only review mode.</text>
<text x="18" y="58">assistant&gt; pi --tools read,grep,find,ls --no-session -p &quot;Review the repository.&quot;</text>
<text x="18" y="78">assistant&gt; write and edit tools are disabled for this run.</text>
<text x="18" y="98">assistant&gt; READONLY SCOPE READY</text>
<text x="18" y="118">inspect files</text>
<text x="18" y="138"></text>
<text x="18" y="158">pi&gt; user&gt; inspect files</text>
<text x="18" y="178">assistant&gt; read package metadata.</text>
<text x="18" y="198">assistant&gt; find recipe files under examples/.</text>
<text x="18" y="218">assistant&gt; grep for assertion coverage and sandbox guards.</text>
<text x="18" y="238">assistant&gt; no write/edit tools were enabled.</text>
<text x="18" y="258">assistant&gt; READONLY INSPECTION COMPLETE</text>
<text x="18" y="278">run validation</text>
<text x="18" y="298"></text>
<text x="18" y="318">pi&gt; user&gt; run validation</text>
<text x="18" y="338">assistant&gt; bash tool is intentionally unavailable in this read-only pass.</text>
<text x="18" y="358">assistant&gt; operator requests separate CI validation.</text>
<text x="18" y="378">assistant&gt; recorded expectation: 12 tests passed in prior validation.</text>
<text x="18" y="398">assistant&gt; READONLY VALIDATION COMPLETE</text>
<text x="18" y="418">report findings</text>
<text x="18" y="438"></text>
<text x="18" y="458">pi&gt; user&gt; report findings</text>
<text x="18" y="478">assistant&gt; Findings: no blocking issues.</text>
<text x="18" y="498">assistant&gt; Residual risk: provider-backed live runs are covered by separate recipes.</text>
<text x="18" y="518">assistant&gt; READONLY REVIEW COMPLETE</text>
<text x="18" y="538">exit</text>
<text x="18" y="558"></text>
<text x="18" y="578">pi&gt; assistant&gt; Closing Pi workflow demonstration.</text>
<text x="18" y="598">WORKFLOW SESSION COMPLETE</text>
