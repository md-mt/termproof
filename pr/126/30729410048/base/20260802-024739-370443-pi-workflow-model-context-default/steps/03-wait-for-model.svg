<text x="18" y="38">Pi workflow: model routing and context resources</text>
<text x="18" y="58">Type workflow commands; use exit to close.</text>
<text x="18" y="78"></text>
<text x="18" y="98">pi&gt; choose model</text>
<text x="18" y="118">user&gt; choose model</text>
<text x="18" y="138">assistant&gt; pi --provider openai --model gpt-4o-mini</text>
<text x="18" y="158">assistant&gt; pi --model sonnet:high --thinking high</text>
<text x="18" y="178">assistant&gt; pi --models claude-sonnet,claude-haiku,gpt-4o</text>
<text x="18" y="198">assistant&gt; MODEL ROUTING READY</text>
</svg>
