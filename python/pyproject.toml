[project]
name = "termproof"
version = "0.3.4"
description = "Evidence-first verification for TUI and terminal applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mengwei Ding" }]
keywords = ["asciinema", "terminal", "tui", "verification", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "imageio-ffmpeg>=0.6.0",
  "jsonschema>=4.0",
  "pexpect>=4.9.0",
  "pillow>=10.0",
  "pyte>=0.8.2",
  "pyyaml>=6.0",
]

# `asciinema` is a CLI, never imported. The default session backend records the
# cast itself, so it is only needed by `PexpectAsciinemaBackend`. Keeping it out
# of the base install matters for consumers that vendor their dependencies —
# every one of the six above is commonly already present, and this was the only
# package termproof would have introduced from scratch.
[project.optional-dependencies]
record = ["asciinema>=2.4.0"]

[project.urls]
Homepage = "https://github.com/md-mt/termproof"
Repository = "https://github.com/md-mt/termproof"
Issues = "https://github.com/md-mt/termproof/issues"

[project.scripts]
termproof = "termproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["termproof"]

# The canonical recipe schema is a package resource
# (`termproof/_resources/recipe-schema-v1.json`), not a docs file relocated at
# build time. It used to be force-included here from `docs/`, which put it in
# the wheel and nowhere else: a build system that consumes the sdist's sources
# directly never runs a hatchling force-include, so
# `recipe_schema.load_recipe_schema()` found nothing (#174). Owning the file
# inside the package means every artifact that carries `termproof/` carries the
# schema, with no build step to reproduce.

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Keep the original unanchored include list (gitignore-style matching). Bare
# names like `docs` or `tests` intentionally match nested assets
# (plugin-template/** and site/README.md shipped in the base revision's sdist),
# so anything added under those directories ships. The artifact-content
# regression test (tests/test_sdist_artifact_content.py) guards what that
# reaches.
include = [
  "termproof",
  "tests",
  "examples",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "examples/artifacts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.6",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests use long inline assertion messages and occasional throwaway locals/loop vars.
"tests/**" = ["E501", "F841", "B007"]
# These modules embed long single-line SVG/recipe string literals that read worse when wrapped.
"termproof/builtin_renderers.py" = ["E501"]
"scripts/oracle_probe.py" = ["E501"]
"scripts/validate_case_studies.py" = ["E501"]
"termproof/demo.py" = ["E501"]
"termproof/demo_tui.py" = ["E501"]
"termproof/screen.py" = ["E501"]
"termproof/visual_diff.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# runner.py builds registries with `lambda c=cls: c()` factories; mypy cannot infer
# the type of a lambda with a default argument ("Cannot infer type of lambda" [misc]).
# This is a known mypy limitation for that pattern, so scope the noisy code down here
# rather than rewrite the working registry-wiring code.
[[tool.mypy.overrides]]
module = "termproof.runner"
disable_error_code = ["misc"]

[tool.coverage.run]
branch = true
source = ["termproof"]

[tool.coverage.report]
show_missing = true
