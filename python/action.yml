name: TermProof

description: |
  Run TermProof recipes and upload reviewable evidence.
  Installs TermProof from PyPI — requires a published release (v0.2.1+).
  Until then, use the CI workflow directly or install from source.

inputs:
  recipe-path:
    description: Recipe file or directory to execute.
    required: true
  video:
    description: Render MP4 evidence (true or false).
    required: false
    default: "true"
  fps:
    description: Video frames per second.
    required: false
    default: "60"
  engine:
    description: |
      Engine to use (auto, python). Auto reuses a `termproof` already on PATH.
      `rust` is no longer accepted — the Rust engine moved to
      https://github.com/md-mt/termproof-rust and does not publish releases yet.
    required: false
    default: "auto"

outputs:
  evidence-path:
    value: ${{ steps.run.outputs.evidence-path }}
    description: Directory containing TermProof evidence.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - uses: astral-sh/setup-uv@v7
    - name: Install TermProof
      shell: bash
      run: |
        engine="${{ inputs.engine }}"
        case "$engine" in
          rust)
            echo "::error::engine: rust is no longer supported by this action. The Rust engine moved to https://github.com/md-mt/termproof-rust, which has not published a release yet. Use engine: python (or auto) until it does."
            exit 1
            ;;
          auto|python) ;;
          *)
            echo "::error::Unknown engine '$engine'. Supported values: auto, python."
            exit 1
            ;;
        esac
        if [[ "$engine" == "auto" ]] && command -v termproof >/dev/null 2>&1; then
          echo "Using existing termproof binary"
        else
          uv tool install termproof
        fi
    - id: run
      name: Execute recipes
      shell: bash
      run: |
        out="${RUNNER_TEMP}/termproof-evidence"
        args=(termproof run "${{ inputs.recipe-path }}" --out "$out")
        if [[ "${{ inputs.video }}" == "true" ]]; then args+=(--video --video-fps "${{ inputs.fps }}"); fi
        "${args[@]}"
        echo "evidence-path=$out" >> "$GITHUB_OUTPUT"
    - name: Write evidence summary
      if: always()
      shell: bash
      run: |
        echo '## TermProof evidence' >> "$GITHUB_STEP_SUMMARY"
        if [[ -f "${RUNNER_TEMP}/termproof-evidence/latest-report.md" ]]; then cat "${RUNNER_TEMP}/termproof-evidence/latest-report.md" >> "$GITHUB_STEP_SUMMARY"; fi
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: termproof-evidence
        path: ${{ runner.temp }}/termproof-evidence
        if-no-files-found: ignore
