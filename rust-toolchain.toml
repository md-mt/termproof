# Pin the Rust toolchain for this workspace.
#
# `rustup` (used by CI and most developers) reads this file and installs the
# pinned channel automatically. Homebrew/manual installs should install the
# same exact channel. The pin is the exact stable release that matches the MSRV
# declared as `rust-version = "1.96"` in Cargo.toml; a moving alias like
# `stable` would not give the reproducibility documented in
# docs/engineering-baseline.md.

[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
