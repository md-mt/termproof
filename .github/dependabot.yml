version: 2
updates:
  # Python dependencies declared in python/pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "area:distro"
    commit-message:
      prefix: "chore"

  # Cargo updates arrive as one grouped PR. The workspace treats a version
  # requirement as a floor with tests at the floor (see
  # rust/docs/engineering-baseline.md §6), so a grouped update is reviewed
  # against the floor tests in one place rather than piecemeal.
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      cargo:
        patterns:
          - "*"
    # Three upgrades are held, not missed. v1.0 is gated on Python parity, and
    # each of these moves what the differential harnesses compare, so they are
    # taken together and on purpose rather than in a weekly grouped PR. The
    # decision and the conditions for lifting it are tracked in #221; the
    # per-crate reasoning is on each requirement in rust/Cargo.toml. Remove an
    # entry here in the same change that moves its requirement there.
    ignore:
      # 1.x redraws the generated recipe schema (`definitions` -> `$defs`,
      # key and `required` order) and turns `preserve_order` into a
      # graph-global `serde_json` switch; held at 0.8 since #28. 0.9 is not
      # a step short of that: upstream's changelog has 0.9.0 as identical to
      # 1.0.0-alpha.18, so it carries the same redraw.
      - dependency-name: "schemars"
        versions: [">=0.9"]
      # Cargo.toml declares `>=0.32, <0.34`, the range the suite and both
      # harnesses are run against, so anything at or above 0.34 is outside
      # what is tested. 0.56 is the version that was evaluated and declined;
      # the versions between were never looked at, which is a reason to
      # ignore them too, not to let them through.
      - dependency-name: "jsonschema"
        versions: [">=0.34"]
      # Coupled to the jsonschema hold. Our `fancy-regex` requirement exists
      # to share jsonschema's copy of the engine: jsonschema 0.33 asks for
      # `^0.16`, 0.56 asks for `^0.19`. Anything from 0.17 up, taken alone,
      # would put 0.16.2 (jsonschema's) and the newer one (ours) in the
      # lockfile, and deny.toml has no skip for that pair, so `cargo deny
      # check bans` would fail. It moves when jsonschema does.
      - dependency-name: "fancy-regex"
        versions: [">=0.17"]

  # GitHub Actions used by the workflows in .github/workflows. One entry covers
  # both implementations: GitHub reads only the root workflow directory, so
  # there is only one action surface to keep current. Every third-party action
  # in the Rust workflows is pinned to an immutable commit SHA with a version
  # comment (see rust/docs/engineering-baseline.md §11); Dependabot moves the
  # SHA and the comment together, which is the only way a pin does not rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A single catch-all group means this ecosystem can only ever open one PR.
    open-pull-requests-limit: 1
    labels:
      - "area:ci"
    commit-message:
      prefix: "chore"
    # Batch every action bump into one PR: "are our CI actions current" is one
    # question, and separate PRs overlap heavily across the workflow files.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"

  # Docker base images follow the same rule for the same reason: each
  # Dockerfile pins its stages by digest, and a digest with nobody moving it is
  # a pin that rots into an unpatched base. Dependabot moves the tag and the
  # digest together.
  - package-ecosystem: "docker"
    directories:
      - "/python/docker"
      - "/rust/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      docker:
        patterns:
          - "*"
    # The rust image is the exception to "moves the tag": its version is not
    # Dependabot's to choose. Both Dockerfiles build with the channel pinned in
    # rust/rust-toolchain.toml, and the drift test from #218
    # (python/tests/test_docker_image.py) fails when they disagree, which is
    # what #232 ran into by taking both images to 1.99.0. The image moves in
    # the same deliberate change that bumps the toolchain, not in a weekly PR.
    ignore:
      # Update types rather than a `versions` range, for two reasons. A range
      # would have to name the pinned number and be edited on every toolchain
      # bump; this follows whatever tag the Dockerfiles currently carry. And
      # only version updates are ignored, so a refreshed digest for the same
      # tag still arrives and the pin does not rot. The debian and python
      # images are not named here and keep updating as before.
      - dependency-name: "rust"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
