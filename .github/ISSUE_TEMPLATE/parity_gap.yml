name: Parity gap
description: The two implementations disagree on the same recipe. Read the status-and-parity and conformance documents first.
title: "[Parity]: "
body:
  - type: markdown
    attributes:
      value: |
        TermProof has two implementations. The Python one under `python/` is the shipped product and the behavioural oracle; the Rust one under `rust/` is an in-progress port. A *parity gap* is a case where the two disagree. Before filing:
        - Read [rust/docs/status-and-parity.md](https://github.com/md-mt/termproof/blob/main/rust/docs/status-and-parity.md) — the port is **not at parity** and there is no parity gate.
        - Read [conformance/README.md](https://github.com/md-mt/termproof/blob/main/conformance/README.md) — the differential harness already enumerates known divergences; check that this one is not already listed.
  - type: textarea
    id: layer
    attributes:
      label: Layer
      description: Where do the two runtimes disagree? Steps, assertions, terminal/session behaviour, evidence output, or something else?
    validations:
      required: true
  - type: textarea
    id: oracle
    attributes:
      label: Python (oracle) behaviour
      description: What the Python implementation does — verdict, diagnostic text, output. Include the TermProof version you tested against.
    validations:
      required: true
  - type: textarea
    id: port
    attributes:
      label: Rust implementation behaviour
      description: What the Rust implementation does instead — verdict, diagnostic text, output. Include the commit or tag you tested against.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The recipe, corpus case, or commands that show the divergence. A minimal case is ideal.
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: Measurement context
      description: If you ran the differential harness, what did it report? Which counts moved, and in which direction?
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I read rust/docs/status-and-parity.md and understand the Rust implementation is not at parity.
          required: true
        - label: I read conformance/README.md and confirmed this divergence is not already enumerated there.
          required: true
