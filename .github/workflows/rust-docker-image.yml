# Builds the `termproof` container image and publishes it to GitHub's
# registry at ghcr.io/<owner>/termproof-rust.
#
# ## What proves the image works
#
# A pull request builds the image and does not push it, and then runs a real
# recipe *inside the image it just built* — `rust/docker/smoke/run-smoke.sh`, which
# is baked in so the same command reproduces the check by hand. That recipe
# drives `rsvg-convert` and `ffmpeg` on a pseudo-terminal and asserts on the
# PNG, the MP4 and the evidence TermProof wrote, not on the exit code alone.
#
# The order matters: the smoke step is a `needs`-free step in the same job,
# after the build and before any push, so an image that cannot run a recipe
# never reaches the registry. `rust/docker/termproof.Dockerfile` explains which
# external programs are in the image and which are deliberately not.
#
# ## Tags
#
# The same scheme the Python sibling publishes under: branch, tag, `sha-`
# prefix, and `latest` only on the default branch. On a pull request
# metadata-action still computes tags — nothing is pushed with them, but the
# build is labelled the same way, so the tag expression itself is exercised.
#
# ## Credentials
#
# The built-in `GITHUB_TOKEN` with `packages: write`. There is no new secret
# and nothing to rotate. `contents: read` is the default and stays explicit.
#
# ## A push has to land, not just leave
#
# The step after the push reads every tag back from GHCR and compares its
# digest with the image the smoke step exercised. That readback exists
# because of #178: the `rs-v0.3.4` push was denied (`write_package`), this
# job went red, and nothing on the release path waited on this job — the
# release shipped with no image behind it and nobody was notified. A red
# job nobody needs is easy to miss; a job that ends by asking the registry
# leaves the answer, tag by tag with digests, in its own summary.
name: Docker Image (Rust)

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-docker-image.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust-docker-image.yml"
    tags:
      - "rs-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

# Namespaced per implementation. An unqualified `docker-image-<ref>` would put
# this workflow and its Python sibling in one group, so a push touching both
# trees would serialise two independent image builds behind each other.
concurrency:
  group: rust-docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # Stable, explicit name: repository rulesets reference required checks by
    # name (docs/engineering-baseline.md §11).
    name: Build, smoke-test and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/termproof-rust
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Built once, loaded into the runner's daemon rather than pushed, so the
      # smoke run below and the push below operate on the same image. `load`
      # needs a single-platform build; linux/amd64 is what the runners are and
      # what the release binaries target first.
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: rust
          file: rust/docker/termproof.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gate. Runs a recipe end to end inside the freshly built image and
      # asserts on what it produced; see docker/smoke/run-smoke.sh for the
      # full list of checks. Nothing is pushed if this fails.
      - name: Run a recipe inside the built image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run --rm --entrypoint /opt/termproof/smoke/run-smoke.sh "$IMAGE"

      # Recorded on the run summary so the smoke result is not the only thing
      # a reviewer can see about the image. Every value reaches the shell
      # through `env:` rather than through `${{ }}` inside `run:`.
      - name: Report what the image contains
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
        run: |
          SIZE=$(docker image inspect "$IMAGE" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1048576}')
          VERSION=$(docker run --rm "$IMAGE" --version)
          {
            echo "### Image"
            echo
            echo "- Version: $VERSION"
            echo "- Size: $SIZE"
            echo "- Pushed: $PUSHED"
            echo "- Tags:"
            echo "$TAGS" | while IFS= read -r tag; do
              [ -n "$tag" ] && echo "  - \`$tag\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker push` on the already-loaded tags rather than a second
      # build-push-action run. A rebuild — even a fully cached one — is a
      # different export of the image than the one the smoke step just ran, and
      # the whole point of the smoke step is that what gets published is what
      # was tested. This pushes those exact bytes.
      - name: Push the image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # A here-string, not a pipe, so the loop runs in this shell rather
          # than a pipeline subshell. The piped form already failed the step
          # on a denied push — `|| exit 1` under Actions' default
          # `bash -eo pipefail` saw to that — so this is clarity, not a fix.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "pushing $tag"
            docker push "$tag" || exit 1
          done <<< "$TAGS"

      # The receipt. `docker push` exiting zero is a claim about the upload;
      # this asks GHCR what the tags point at now and requires the answer to
      # be the image that was just pushed, digest for digest. `imagetools`
      # rather than the packages API: buildx is already set up, the GHCR login
      # above is still live, and a manifest read is the question a consumer's
      # pull asks — no extra token scope for the same answer. The short retry
      # covers a manifest that is not readable in the same second it landed.
      - name: Verify the image is in GHCR
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$(printf '%s' "$TAGS" | tr -d '[:space:]')" ]; then
            echo "::error::no image tags were computed for this push, so nothing was published"
            exit 1
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            expected="$(docker image inspect "$tag" --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' | cut -d@ -f2)"
            if [ -z "$expected" ]; then
              echo "::error::the pushed image records no registry digest for $tag"
              exit 1
            fi
            published=""
            for attempt in 1 2 3 4 5; do
              if published="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$tag" 2>/dev/null | jq -er .digest)" && [ -n "$published" ]; then
                break
              fi
              published=""
              if [ "$attempt" -lt 5 ]; then sleep 5; fi
            done
            if [ -z "$published" ]; then
              echo "::error::$tag is not in GHCR after the push — the publish did not land"
              exit 1
            fi
            if [ "$published" != "$expected" ]; then
              echo "::error::$tag in GHCR is $published, not the pushed image $expected"
              exit 1
            fi
            echo "verified $tag at $published"
            echo "- Verified in GHCR: \`$tag\` at \`$published\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"
