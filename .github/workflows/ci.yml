name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, build, and verify TUI evidence
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Rust for agg
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-agg-v1.9.0-${{ runner.os }}

      - name: Install system render dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install agg
        run: |
          if ! command -v agg >/dev/null 2>&1; then
            cargo install --locked --git https://github.com/asciinema/agg --tag v1.9.0
          fi

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      - name: Build package
        run: uv build

      - name: Run portable end-to-end TUI verification
        run: |
          uv run tui-verify run \
            examples/generic \
            examples/multi_turn_conversation.recipe.json \
            examples/pi_workflow_readonly_review.recipe.json \
            examples/pi_workflow_guarded_edit.recipe.json \
            examples/pi_workflow_session_resume_export.recipe.json \
            examples/pi_workflow_model_context.recipe.json \
            --video --video-fps 60 --out .tui-verifier/ci

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui-verifier-ci-evidence
          path: .tui-verifier/ci
          if-no-files-found: ignore

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tui-verifier-dist
          path: dist/*
