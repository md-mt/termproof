# Builds the Python implementation's container image and publishes it to
# GitHub's registry at ghcr.io/<owner>/termproof.
#
# Its Rust sibling (rust-docker-image.yml) publishes a *different* image, from
# a different context, with a different base and a different binary inside —
# two images is the intent, not duplication to be collapsed. What the two do
# share is the tag scheme (branch, tag, `sha-` prefix, `latest` only on the
# default branch), the credential (the built-in GITHUB_TOKEN with
# `packages: write`, nothing to rotate), the concurrency shape and the GHA
# build cache, and those are written the same way in both files.
#
# The one thing they deliberately do not share: the Rust image is smoke-tested
# by running a real recipe inside the freshly built image before anything is
# pushed (see rust-docker-image.yml). This one is not — it builds and pushes.
# Closing that gap is a behavioural change and is not made here.
name: Docker Image (Python)

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-docker-image.yml"
  push:
    branches:
      - main
    paths:
      - "python/**"
      - ".github/workflows/python-docker-image.yml"
    tags:
      - "py-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/termproof
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: python
          file: python/docker/termproof.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
