name: Release (Python)

on:
  push:
    tags:
      - "py-v*.*.*"
  workflow_dispatch:

# Read by default, elevated on the one job that writes, matching Release
# (Rust).
permissions:
  contents: read

defaults:
  run:
    working-directory: python

# One release at a time per ref, and never cancelled: a run killed between the
# GitHub release and the PyPI publish leaves half a release behind.
concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify TUI evidence and release
    runs-on: ubuntu-latest
    # See the note in CI (Python): unbounded jobs run to GitHub's six-hour
    # ceiling when a network step stalls (#183). A release renders the full
    # evidence suite at 60fps, so it gets more headroom than the CI job.
    timeout-minutes: 45
    environment: pypi
    permissions:
      # `contents: write` creates the GitHub release; `id-token: write` is
      # PyPI trusted publishing.
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Rust for agg
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-agg-v1.9.0-${{ runner.os }}

      # No `apt-get install ffmpeg` here either (#183) — `imageio-ffmpeg` is a
      # hard runtime dependency and ships the binary, so this confirms what is
      # already installed instead of putting a package mirror in front of a
      # release. See the longer note in CI (Python).
      - name: Confirm ffmpeg resolves without a package mirror
        # This is the job's first `uv run`, so it absorbs the dependency sync;
        # bounded like the other installs rather than like a one-second check.
        timeout-minutes: 10
        run: |
          uv run python -c "
          import subprocess
          from termproof.evidence import find_ffmpeg
          ffmpeg = find_ffmpeg()
          banner = subprocess.run(
              [ffmpeg, '-version'], capture_output=True, text=True, check=True
          ).stdout.splitlines()[0]
          print(f'{ffmpeg}\n{banner}')
          "

      - name: Install agg
        timeout-minutes: 20
        run: |
          if ! command -v agg >/dev/null 2>&1; then
            "$GITHUB_WORKSPACE/.github/scripts/retry.sh" --attempts 3 --timeout 480 -- \
              cargo install --locked --git https://github.com/asciinema/agg --tag v1.9.0
          fi

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      # The schema ships inside the artifact built below, and every other copy
      # of it — the crate's and the published docs path — has to be the same
      # bytes (#174). CI (Python) runs this on pull requests and on `main`, but
      # a tag can be cut from a commit that went through neither, so the gate
      # is repeated where the artifact is actually built.
      - name: Canonical recipe schema drift across all copies
        run: python3 scripts/check_schema_copies.py

      - name: Build package
        run: uv build

      - name: Smoke-test installed wheel
        # `pip install` resolves the wheel's dependencies from PyPI (#183).
        timeout-minutes: 10
        run: |
          python -m venv .pkg-test
          .pkg-test/bin/pip install dist/*.whl
          (
            cd /tmp
            "$GITHUB_WORKSPACE/python/.pkg-test/bin/termproof" --help
            "$GITHUB_WORKSPACE/python/.pkg-test/bin/python" -c "import termproof; from pathlib import Path; assert 'site-packages' in str(Path(termproof.__file__))"
          )

      - name: Run release generic and Pi agent UI verification
        run: |
          uv run python -m termproof.ci_evidence run release --out .termproof/release
          tar -czf termproof-release-evidence.tgz -C .termproof release

      - name: Write release verification notes
        if: always()
        run: |
          {
            echo "## TermProof Release Evidence"
            echo
            echo "Evidence archive: \`termproof-release-evidence.tgz\`"
            echo "Report links point to files inside that archive."
            echo
            if [ -f .termproof/release/latest-report.md ]; then
              cat .termproof/release/latest-report.md
            else
              echo "No TermProof report was generated."
            fi
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: termproof-release-evidence
          path: python/.termproof/release
          if-no-files-found: ignore

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: termproof-python-dist
          path: python/dist/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/py-v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: python/release-notes.md
          files: |
            python/dist/*
            python/termproof-release-evidence.tgz

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/py-v') && vars.ENABLE_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

      - name: Note skipped PyPI publish
        if: startsWith(github.ref, 'refs/tags/py-v') && vars.ENABLE_PYPI != 'true'
        run: |
          {
            echo "## PyPI Publish"
            echo
            echo "Skipped because repository variable \`ENABLE_PYPI\` is not \`true\`."
            echo "Configure PyPI trusted publishing, then set \`ENABLE_PYPI=true\` for future release tags."
          } >> "$GITHUB_STEP_SUMMARY"
