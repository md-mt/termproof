name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build release and verify TUI evidence
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Rust for agg
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-agg-v1.9.0-${{ runner.os }}

      - name: Install system render dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install agg
        run: |
          if ! command -v agg >/dev/null 2>&1; then
            cargo install --locked --git https://github.com/asciinema/agg --tag v1.9.0
          fi

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      - name: Build package
        run: uv build

      - name: Smoke-test installed wheel
        run: |
          python -m venv .pkg-test
          .pkg-test/bin/pip install dist/*.whl
          .pkg-test/bin/tui-verify --help

      - name: Run release generic and Pi agent UI verification
        run: |
          uv run tui-verify run \
            examples/generic \
            examples/multi_turn_conversation.recipe.json \
            examples/pi_workflow_readonly_review.recipe.json \
            examples/pi_workflow_guarded_edit.recipe.json \
            examples/pi_workflow_session_resume_export.recipe.json \
            examples/pi_workflow_model_context.recipe.json \
            --video --video-fps 60 --out .tui-verifier/release
          tar -czf tui-verifier-release-evidence.tgz -C .tui-verifier release

      - name: Write release verification notes
        if: always()
        run: |
          {
            echo "## TUI Verifier Release Evidence"
            echo
            echo "Evidence archive: \`tui-verifier-release-evidence.tgz\`"
            echo "Report links point to files inside that archive."
            echo
            if [ -f .tui-verifier/release/latest-report.md ]; then
              cat .tui-verifier/release/latest-report.md
            else
              echo "No TUI verifier report was generated."
            fi
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui-verifier-release-evidence
          path: .tui-verifier/release
          if-no-files-found: ignore

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tui-verifier-dist
          path: dist/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*
            tui-verifier-release-evidence.tgz

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
