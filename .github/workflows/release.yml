name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build release and verify TUI evidence
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Rust for agg
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-agg-v1.9.0-${{ runner.os }}

      - name: Install system render dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install agg
        run: |
          if ! command -v agg >/dev/null 2>&1; then
            cargo install --locked --git https://github.com/asciinema/agg --tag v1.9.0
          fi

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      - name: Build package
        run: uv build

      - name: Smoke-test installed wheel
        run: |
          python -m venv .pkg-test
          .pkg-test/bin/pip install dist/*.whl
          (
            cd /tmp
            "$GITHUB_WORKSPACE/.pkg-test/bin/termproof" --help
            "$GITHUB_WORKSPACE/.pkg-test/bin/python" -c "import termproof; from pathlib import Path; assert 'site-packages' in str(Path(termproof.__file__))"
          )

      - name: Run release generic and Pi agent UI verification
        run: |
          uv run python -m termproof.ci_evidence run release --out .termproof/release
          tar -czf termproof-release-evidence.tgz -C .termproof release

      - name: Write release verification notes
        if: always()
        run: |
          {
            echo "## TermProof Release Evidence"
            echo
            echo "Evidence archive: \`termproof-release-evidence.tgz\`"
            echo "Report links point to files inside that archive."
            echo
            if [ -f .termproof/release/latest-report.md ]; then
              cat .termproof/release/latest-report.md
            else
              echo "No TermProof report was generated."
            fi
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termproof-release-evidence
          path: .termproof/release
          if-no-files-found: ignore

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termproof-dist
          path: dist/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/*
            termproof-release-evidence.tgz

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Note skipped PyPI publish
        if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PYPI != 'true'
        run: |
          {
            echo "## PyPI Publish"
            echo
            echo "Skipped because repository variable \`ENABLE_PYPI\` is not \`true\`."
            echo "Configure PyPI trusted publishing, then set \`ENABLE_PYPI=true\` for future release tags."
          } >> "$GITHUB_STEP_SUMMARY"
