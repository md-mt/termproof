name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, os: ubuntu-latest }
          - { target: macos-arm64, os: macos-14 }
          - { target: macos-x86_64, os: macos-13 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - env:
          TERMPROOF_AGG_TARGET: "${{ matrix.target }}"
        run: uv run python scripts/build_agg.py --target "$TERMPROOF_AGG_TARGET" && uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: "wheel-${{ matrix.target }}"
          path: dist/*.whl
  publish:
    needs: wheel
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
