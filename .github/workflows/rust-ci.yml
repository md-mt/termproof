name: CI (Rust)

# No `paths:` filter here, deliberately (#226). A workflow that is filtered out
# reports no check at all, and a required check that never reports is
# indistinguishable from one still running — so a rollup of this workflow could
# not be made required without blocking every PR that leaves Rust alone. The
# workflow therefore starts on every PR and every push to `main`, the `changes`
# job below decides whether there is anything to test, and `CI (Rust) result`
# reports either way.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Matches CI (Python): supersede a pull request's earlier runs, never a run on
# `main`.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the workflow-level `paths:` used to decide, moved into a job so the
  # workflow itself always runs. Plain `git diff` with the path set as
  # pathspecs rather than a third-party filter action: git does the matching,
  # so there is no pattern dialect to get subtly wrong and nothing new to pin.
  changes:
    name: Detect Rust-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      # Full history: the base of the comparison is a commit named by the
      # event, and a shallow clone holds only the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A pull request is compared against its base and a push against the
      # commit `main` pointed at before it. Every case with no usable base
      # answers `true`: a manual dispatch has none, a push that creates a ref
      # carries all zeros, and a force-push can name a commit that is no longer
      # fetchable. So does a `git diff` that errors rather than answers. Running
      # the suite when it was not needed costs minutes; skipping it when it was
      # needed is the false all-clear this job exists to prevent.
      #
      # On a pull request HEAD is the merge commit, so a base SHA that has gone
      # stale since the event fired widens the diff to include what landed on
      # `main` in between. That errs in the same direction.
      - name: Diff against the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -u
          rust=true
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch: running everything"
          elif [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit in the event: running everything"
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base $BASE is not in this clone: running everything"
          else
            status=0
            git diff --quiet "$BASE" HEAD -- \
              rust spec conformance .github/workflows/rust-ci.yml || status=$?
            case "$status" in
              0) rust=false; echo "no Rust-relevant path changed since $BASE" ;;
              1) echo "Rust-relevant paths changed since $BASE:"
                 git diff --name-only "$BASE" HEAD -- \
                   rust spec conformance .github/workflows/rust-ci.yml ;;
              *) echo "git diff exited $status: running everything" ;;
            esac
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  rust:
    name: Lint, type-check and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --manifest-path rust/Cargo.toml --check --all
      - name: clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --manifest-path rust/Cargo.toml --workspace
      # `--all-features` cannot catch a feature that only builds alongside
      # another, which is the failure mode an undeclared `dep:` produces. So
      # check the whole powerset rather than a sample (#27, extended for
      # `schema` in #28, `junit` in #34 and `clap` in #197). `json-schema`
      # implies `schema`, so some combinations resolve to the same set as
      # others — they are run anyway, because what is being checked is that
      # every combination a consumer can *write* compiles, not every set cargo
      # can resolve. `clap` is the first feature that is not in `default`, so
      # `default` and `--all-features` are no longer the same set: the steps
      # above cover `--all-features`, and the combination naming the other four
      # below is `default`.
      #
      # The list is enumerated from FEATURES rather than written out, so adding
      # a feature grows the matrix by construction and cannot be half-extended:
      # five features is thirty-two combinations, and the count is printed so a
      # silently shrinking matrix is visible in the log.
      #
      # Growth is doubling, so it is worth writing down where the ceiling is.
      # Measured on run 32429616067, the last `main` run before `clap`: this
      # step was 7.8 min on ubuntu and 9.3 on macos for sixteen combinations —
      # ~30-35s each — in a job totalling 10.1 and 12.1. Thirty-two puts the
      # step at ~16-19 min and the job at ~18-21, which is why the job's
      # `timeout-minutes` is unchanged at 45. A sixth feature would be ~37 min
      # of powerset in a ~40 min job, past that headroom and near the 60-minute
      # cap `python/tests/test_ci_timeouts.py` enforces on every job. That is
      # the point at which this wants sharding across the job matrix rather
      # than another entry in the array.
      - name: clippy and test each feature combination
        run: |
          set -eux
          FEATURES=(evidence junit json-schema schema clap)
          total=$((1 << ${#FEATURES[@]}))
          echo "feature powerset: $total combinations"
          for mask in $(seq 0 $((total - 1))); do
            combo=""
            for i in "${!FEATURES[@]}"; do
              if (( (mask >> i) & 1 )); then
                combo="${combo:+$combo,}${FEATURES[$i]}"
              fi
            done
            cargo clippy --manifest-path rust/Cargo.toml -p termproof --all-targets \
              --no-default-features --features "$combo" -- -D warnings
            cargo test --manifest-path rust/Cargo.toml -p termproof --no-default-features --features "$combo"
          done
      # A requirement is a claim that the code works at the bottom of its range,
      # and nothing above tests that: the committed lockfile resolves each one
      # to whatever cargo picked, which is not the floor. So each floor declared
      # in the workspace manifest is pinned here and the suite is run against
      # it. Rewriting the requirement to `=` beats `cargo update --precise`,
      # which cannot name a crate the graph contains twice — and this graph
      # does contain reviewed duplicates (see rust/deny.toml). Until #221 it
      # also contained fancy-regex twice at the jsonschema floor, because
      # jsonschema 0.32.0 asked for `^0.15` while we asked for `^0.16`; at
      # the 0.56 floor both sides ask for `^0.19` and share one copy at the
      # floor too. Last step in the job: it dirties Cargo.toml
      # and Cargo.lock, and the checkout is thrown away straight after.
      #
      # fancy-regex pins to 0.19.0, the bottom of `^0.19`, and not to the 0.19.2
      # the lockfile resolves: pinning the version the lock already picks would
      # re-run what the steps above ran and test nothing new (#177).
      # jsonschema pins to 0.56.0, which is both the bottom of `>=0.56, <0.57`
      # and the only 0.56.x release, so today it coincides with the lockfile;
      # the pin is what keeps the floor claim tested if that ever stops
      # being true (#221).
      - name: test at the declared dependency floors
        run: |
          set -eux
          perl -pi -e 's{^fancy-regex = .*}{fancy-regex = "=0.19.0"}' rust/Cargo.toml
          perl -pi -e 's{^jsonschema = .*}{jsonschema = "=0.56.0"}' rust/Cargo.toml
          cargo test --manifest-path rust/Cargo.toml --workspace


  # The one check that means "all of CI (Rust) passed" (#226). Nothing rolled
  # the matrix up before, so the only single green tick on a Rust PR was the
  # publish workflow's gate, which never waited for this workflow and could not
  # have: `needs:` does not cross workflows.
  #
  # `if: always()` is what makes it report at all. Without it a failed or
  # cancelled `rust` leg would skip this job, and a skipped check satisfies a
  # required-check rule — the failure would read as a pass.
  #
  # For the same reason `skipped` is not taken at face value. It is a pass only
  # when `changes` succeeded and said, in so many words, that there was nothing
  # to test; an empty or missing output is a failure, not a `false`.
  result:
    name: CI (Rust) result
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Roll up the needed jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          set -u
          echo "changes: $CHANGES_RESULT (rust=$RUST_CHANGED)"
          echo "rust:    $RUST_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::the changes job ended '$CHANGES_RESULT', so nothing decided whether Rust CI had to run."
            exit 1
          fi
          case "$RUST_RESULT" in
            success)
              ;;
            skipped)
              if [ "$RUST_CHANGED" != "false" ]; then
                echo "::error::the rust job was skipped although changes reported rust='$RUST_CHANGED' — only an explicit 'false' makes a skip a pass."
                exit 1
              fi
              echo "no Rust-relevant path changed; nothing to test"
              ;;
            *)
              echo "::error::the rust job ended '$RUST_RESULT'."
              exit 1
              ;;
          esac
