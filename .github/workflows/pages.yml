name: Pages preview

# NOTE: This workflow is build-validation only. It no longer deploys to
# GitHub Pages. docs-site.yml is the single authoritative github-pages
# deployer (gated on vars.ENABLE_PAGES == 'true'); keeping a second deployer
# for the same environment on shared docs/** and README.md triggers would
# create a completion-order race on the live site. The build job below still
# assembles and validates the legacy site/ preview so content regressions are
# caught in CI.

on:
  push:
    branches: [main]
    paths:
      - "python/site/**"
      - "python/docs/**"
      - "python/examples/artifacts/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "python/site/**"
      - "python/docs/**"
      - "python/examples/artifacts/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Pages site preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site preview
        run: |
          echo "Building site from python/site/ + python/docs/ + curated artifacts"
          mkdir -p _site
          # copy static site
          cp -r python/site/* _site/
          # copy docs as assets for reference (Markdown)
          mkdir -p _site/docs
          cp -r python/docs/* _site/docs/ || true
          # copy curated evidence artifacts (from site/artifacts/ — not examples/artifacts/)
          if [ -d python/site/artifacts ]; then
            cp -r python/site/artifacts _site/artifacts
            # remove the source copy so find doesn't confuse the count
            rm -rf python/site/artifacts
          fi
          # generate an evidence index with working relative links
          if [ -d _site/artifacts ]; then
            echo "<h1>Evidence artifacts</h1><ul>" > _site/artifacts/index.html
            find _site/artifacts -type f | sort | while read f; do
              rel="${f#_site/artifacts/}"
              echo "<li><a href=\"${rel}\">${rel}</a></li>" >> _site/artifacts/index.html
            done
            echo "</ul>" >> _site/artifacts/index.html
          fi
          # add README rendered copy (raw) — the repository root's, which is
          # the project's front door; python/README.md is the package page
          cp README.md _site/README.md || true
          echo "Site built:"
          ls -la _site | head -40
          echo "----"
          find _site -type f | head -100

      - name: Validate relative links
        run: |
          echo "Checking that every relative link resolves inside _site..."
          failures=0
          cd _site
          # find all href/src attributes in HTML that are relative (not http:// or #)
          for file in $(find . -type f -name '*.html'); do
            links=$(grep -oP '(?:href|src)="([^"]+)"' "$file" | grep -oP '"([^"]+)"' | tr -d '"' || true)
            for link in $links; do
              case "$link" in
                http://*|https://*) continue ;;
                \#*) continue ;;
                *)
                  # resolve relative to the file's directory
                  dir=$(dirname "$file")
                  target="$dir/$link"
                  # normalize
                  target=$(echo "$target" | sed 's|/\./|/|g')
                  if [ ! -e "$target" ]; then
                    echo "  BROKEN: $file -> $link (resolved: $target)"
                    failures=$((failures + 1))
                  fi
                  ;;
              esac
            done
          done
          if [ "$failures" -gt 0 ]; then
            echo "ERROR: $failures broken relative links found in _site"
            exit 1
          fi
          echo "All relative links in _site resolve."

      - name: Upload site preview artifact (for private repo safety)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: termproof-pages-preview
          path: _site
          if-no-files-found: warn
