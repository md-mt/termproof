name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "examples/artifacts/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "examples/artifacts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site preview
        run: |
          echo "Building site from site/ + docs/ + curated artifacts"
          mkdir -p _site
          # copy static site
          cp -r site/* _site/
          # copy docs as assets for reference (Markdown)
          mkdir -p _site/docs
          cp -r docs/* _site/docs/ || true
          # copy curated evidence artifacts (from site/artifacts/ — not examples/artifacts/)
          if [ -d site/artifacts ]; then
            cp -r site/artifacts _site/artifacts
            # remove the source copy so find doesn't confuse the count
            rm -rf site/artifacts
          fi
          # generate an evidence index with working relative links
          if [ -d _site/artifacts ]; then
            echo "<h1>Evidence artifacts</h1><ul>" > _site/artifacts/index.html
            find _site/artifacts -type f | sort | while read f; do
              rel="${f#_site/}"
              echo "<li><a href=\"${rel}\">${rel}</a></li>" >> _site/artifacts/index.html
            done
            echo "</ul>" >> _site/artifacts/index.html
          fi
          # add README rendered copy (raw)
          cp README.md _site/README.md || true
          echo "Site built:"
          ls -la _site | head -40
          echo "----"
          find _site -type f | head -100

      - name: Validate relative links
        run: |
          echo "Checking that every relative link resolves inside _site..."
          failures=0
          cd _site
          # find all href/src attributes in HTML that are relative (not http:// or #)
          for file in $(find . -type f -name '*.html'); do
            links=$(grep -oP '(?:href|src)=\"([^\"]+)\"' "$file" | grep -oP '\"([^\"]+)\"' | tr -d '\"' || true)
            for link in $links; do
              case "$link" in
                http://*|https://*) continue ;;
                \#*) continue ;;
                *)
                  # resolve relative to the file's directory
                  dir=$(dirname "$file")
                  target="$dir/$link"
                  # normalize
                  target=$(echo "$target" | sed 's|/\./|/|g')
                  if [ ! -e "$target" ]; then
                    echo "  BROKEN: $file -> $link (resolved: $target)"
                    failures=$((failures + 1))
                  fi
                  ;;
              esac
            done
          done
          if [ "$failures" -gt 0 ]; then
            echo "ERROR: $failures broken relative links found in _site"
            exit 1
          fi
          echo "All relative links in _site resolve."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload site preview artifact (for private repo safety)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termproof-pages-preview
          path: _site
          if-no-files-found: warn

  # Deployment is guarded so private repos without Pages enabled do not fail CI.
  # For private repos, set repository variable ENABLE_PAGES=true to enable,
  # or rely on public visibility. The job will be skipped otherwise.
  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && (
        vars.ENABLE_PAGES == 'true' ||
        github.event.repository.visibility == 'public'
      )) || (
        github.event_name == 'workflow_dispatch' && (
          vars.ENABLE_PAGES == 'true' ||
          github.event.repository.visibility == 'public'
        )
      )
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Keep a separate notification that deploy was skipped for private repos — informative only.
  deploy-skipped:
    name: Pages deploy skipped (private repo guard)
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !(vars.ENABLE_PAGES == 'true' ||
        github.event.repository.visibility == 'public')
    steps:
      - run: |
          echo "Pages deploy skipped — repository is private and ENABLE_PAGES is not 'true'."
          echo "To enable Pages on this private repo, set the repository variable ENABLE_PAGES=true"
          echo "in Settings > Secrets and variables > Actions > Variables, and enable Pages"
          echo "in Settings > Pages (source: GitHub Actions)."
          echo "Artifact 'termproof-pages-preview' contains the site preview."
