name: CI (Python)

# The root community-health documents are in the trigger list because this
# workflow is what checks them: `tests/test_public_claims.py` sweeps the whole
# repository for withdrawn claims, `test_docs_pages.py` reads the root README,
# `test_community_health.py` reads SECURITY.md and SUPPORT.md, and
# `check_version.py` reads the root CHANGELOG. Before consolidation those files
# lived under `python/` and were covered by the `python/**` filter; at the root
# they matched nothing, so a PR touching only them ran no workflow at all.
#
# `.github/workflows/**` and `.github/scripts/**` are here for the same reason
# one step further out: this suite is where the workflow contracts are
# asserted. `test_release_docs.py` reads the tag filters out of both release
# workflows and the crates publish guard, `test_version_bump.py` reads
# `version-bump.py` and the auto-release workflow, `test_ci_evidence.py` reads
# this file and the Python release workflow, and `test_docs_pages.py` and
# `test_docs_site.py` read the Pages and docs-site workflows. Eight of the nine
# were outside this filter, so editing one ran nothing that reads it.
#
# `rust/crates/termproof/resources/**` is the crate's copy of the canonical
# recipe schema. Each package carries the schema inside itself (#174), so
# `check_schema_copies.py` in the `lint` job holds every copy byte-identical
# against the Python package resource — and it has to run when *any* of them
# moves, which is why a `rust/` path is in a Python workflow's filter.
#
# The two lists are identical and written out twice: GitHub Actions does not
# expand YAML anchors, so an alias here would be read as a literal string and
# match nothing.
on:
  pull_request:
    paths:
      - "python/**"
      - "spec/**"
      - "conformance/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "rust/Cargo.toml"
      - "rust/crates/termproof/resources/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  push:
    branches:
      - main
    paths:
      - "python/**"
      - "spec/**"
      - "conformance/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "rust/Cargo.toml"
      - "rust/crates/termproof/resources/**"
      - ".github/workflows/**"
      - ".github/scripts/**"

defaults:
  run:
    working-directory: python

# One run per ref. Pull-request pushes supersede each other — the evidence run
# is the expensive job here and a superseded one has nothing left to say — but
# a `main` run is never cancelled, because it publishes to the evidence branch.
concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read by default, matching CI (Rust). The `verify` job elevates for the two
# things that actually write — the screenshot evidence branch and the sticky PR
# comment — so a change to any other job cannot reach a write token.
permissions:
  contents: read

jobs:
  stdlib:
    # Deliberately installs nothing. `termproof.attributed` and the other
    # pure-model modules document themselves as depending on the standard
    # library alone, and this is what holds them to it: an `import pyte` added
    # to one of them fails here while the full suite, which has pyte installed,
    # stays green. Runs in seconds and needs no toolchain, so it goes first.
    name: Stdlib-only modules
    runs-on: ubuntu-latest
    # Every job here carries a `timeout-minutes`. Without one the ceiling is
    # GitHub's six hours, which is what #183 burned eighteen job-hours against:
    # a quiet package mirror stalled the install step and nothing bounded it.
    # The values are sized off measured duration, not guessed — see the table
    # in `test_ci_timeouts.py`. They are backstops against a hang, not budgets,
    # so they sit far above the observed maximum; a timeout tight enough to
    # trip on ordinary variance would trade one flake for another.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run the stdlib-only test subset with no packages installed
        run: python scripts/run_stdlib_tests.py

  lint:
    name: Lint, type-check and version drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        timeout-minutes: 10
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy type check
        run: uv run mypy termproof

      # Both implementations share one version train, which is a claim the root
      # README, CHANGELOG and SECURITY.md all make. This is what holds
      # pyproject.toml, rust/Cargo.toml and the root CHANGELOG to it.
      - name: Version and changelog drift
        run: uv run python scripts/check_version.py

      # Each package carries the canonical recipe schema inside itself, and
      # `docs/` keeps a copy at the path the schema is published at (#174).
      # This is what keeps all three one file. It lives here, in the job that
      # already owns cross-implementation drift, and not in CI (Rust): this
      # workflow's path filter covers every copy, so any of them changing runs
      # it, while `rust/**` would miss an edit to the Python side entirely.
      # The release paths repeat it — see check_schema_copies.py.
      - name: Canonical recipe schema drift across all copies
        run: uv run python scripts/check_schema_copies.py

  test:
    name: Unit tests and coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Rust for agg
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-agg-v1.9.0-${{ runner.os }}

      # There is deliberately no `apt-get install ffmpeg` here any more (#183).
      # `termproof.evidence.find_ffmpeg` prefers an ffmpeg on PATH and falls
      # back to `imageio_ffmpeg.get_ffmpeg_exe()`, and `imageio-ffmpeg` is a
      # hard runtime dependency in `pyproject.toml` whose Linux wheel carries
      # the binary. `uv sync` therefore already puts a working ffmpeg on this
      # runner, and the apt step only added a package mirror to the critical
      # path of a job that spawns ffmpeg once. `test_ffmpeg_needs_no_mirror.py`
      # is what holds that dependency in place.

      - name: Install agg
        # Bounds the step; `retry.sh` bounds each attempt inside it, which is
        # the part that lets a retry survive a stall rather than a plain error.
        timeout-minutes: 20
        run: |
          if ! command -v agg >/dev/null 2>&1; then
            "$GITHUB_WORKSPACE/.github/scripts/retry.sh" --attempts 3 --timeout 480 -- \
              cargo install --locked --git https://github.com/asciinema/agg --tag v1.9.0
          fi

      - name: Run unit tests with coverage
        run: |
          uv run coverage run -m unittest discover -s tests
          uv run coverage report

  verify:
    name: Build, verify TUI evidence and publish it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `contents: write` pushes screenshots to the `termproof-evidence`
      # branch; the other two are the sticky PR comment. Nothing else in this
      # workflow needs any of them.
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Rust for agg
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-agg-v1.9.0-${{ runner.os }}

      # This job is the one that actually renders video, so rather than install
      # ffmpeg from a mirror it confirms the one `imageio-ffmpeg` already ships
      # resolves and runs (#183). No network, about a second, and it fails here
      # with a clear message instead of thirty steps later inside a render.
      - name: Confirm ffmpeg resolves without a package mirror
        # This is the job's first `uv run`, so it absorbs the dependency sync;
        # bounded like the other installs rather than like a one-second check.
        timeout-minutes: 10
        run: |
          uv run python -c "
          import subprocess
          from termproof.evidence import find_ffmpeg
          ffmpeg = find_ffmpeg()
          banner = subprocess.run(
              [ffmpeg, '-version'], capture_output=True, text=True, check=True
          ).stdout.splitlines()[0]
          print(f'{ffmpeg}\n{banner}')
          "

      - name: Install agg
        timeout-minutes: 20
        run: |
          if ! command -v agg >/dev/null 2>&1; then
            "$GITHUB_WORKSPACE/.github/scripts/retry.sh" --attempts 3 --timeout 480 -- \
              cargo install --locked --git https://github.com/asciinema/agg --tag v1.9.0
          fi

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      - name: Validate case-study scaffolding (RUST-030 / #35)
        run: python3 scripts/validate_case_studies.py

      - name: Run plugin-template unit tests
        run: |
          PYTHONPATH=plugin-template/src uv run --no-project --with . --with pytest --with pyyaml \
            python -m unittest discover -s plugin-template/tests -v

      - name: Build plugin-template package
        run: |
          (cd plugin-template && uv build)

      - name: Smoke-test plugin-template installed wheel
        # Resolves from PyPI, so it is bounded like the other installs (#183).
        timeout-minutes: 10
        run: |
          (cd plugin-template && python -m venv .pkg-test)
          uv pip install --python plugin-template/.pkg-test/bin/python .
          uv pip install --python plugin-template/.pkg-test/bin/python --no-deps plugin-template/dist/*.whl
          plugin-template/.pkg-test/bin/python -c "
          import termproof_my_plugin
          expected = {'JsonSummaryReporter', 'MyStore', 'ScreenCount', 'StepScreenMatches', 'WaitForRegex'}
          actual = set(termproof_my_plugin.__all__)
          assert actual == expected, f'__all__ mismatch: {actual} != {expected}'
          print('__all__ verified:', termproof_my_plugin.__all__)
          "

      - name: Verify plugin-template config wiring
        run: |
          PYTHONPATH=plugin-template/src uv run python plugin-template/scripts/check_config_wiring.py

      - name: Run plugin-template demo end-to-end
        run: |
          PYTHONPATH=plugin-template/src:$PYTHONPATH uv run termproof run \
            plugin-template/examples/demo.recipe.json \
            --config plugin-template/examples/.termproof/config.yaml \
            --reporter json_summary

      - name: Build package
        run: uv build

      - name: Smoke-test installed wheel
        # `pip install` resolves the wheel's dependencies from PyPI (#183).
        timeout-minutes: 10
        run: |
          python -m venv .pkg-test
          .pkg-test/bin/pip install dist/*.whl
          (
            cd /tmp
            "$GITHUB_WORKSPACE/python/.pkg-test/bin/termproof" --help
            "$GITHUB_WORKSPACE/python/.pkg-test/bin/python" -c "import termproof; from pathlib import Path; assert 'site-packages' in str(Path(termproof.__file__))"
          )

      - name: Run base TUI verification for PR comparison
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add ../termproof-base "$BASE_SHA"
          uv run python -m termproof.ci_evidence run ci \
            --repo ../termproof-base \
            --out "$GITHUB_WORKSPACE/.termproof/pr-base" \
            --continue-on-fail

      - name: Run generic and Pi agent UI verification
        run: |
          uv run python -m termproof.ci_evidence run ci --out .termproof/ci

      - name: Prepare screenshot evidence branch payload
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          uv run python -m termproof.evidence_publish screenshots \
            --base-dir .termproof/pr-base \
            --head-dir .termproof/ci \
            --out .termproof/evidence-branch \
            --pr-number "$PR_NUMBER" \
            --run-id "$RUN_ID"
          # Stage video manifests (do not publish to the evidence branch — videos are hosted on R2/S3)
          uv run python -m termproof.evidence_publish videos \
            --base-dir .termproof/pr-base \
            --head-dir .termproof/ci \
            --out .termproof/evidence-branch \
            --pr-number "$PR_NUMBER" \
            --run-id "$RUN_ID" || true

      - name: Publish video evidence to R2/S3
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          TERM_PROOF_VIDEO_BUCKET: ${{ secrets.TERM_PROOF_VIDEO_BUCKET }}
          TERM_PROOF_VIDEO_PREFIX: ${{ vars.TERM_PROOF_VIDEO_PREFIX }}
          TERM_PROOF_VIDEO_BASE_URL: ${{ vars.TERM_PROOF_VIDEO_BASE_URL }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$TERM_PROOF_VIDEO_BUCKET" ] || [ -z "$TERM_PROOF_VIDEO_BASE_URL" ]; then
            echo "Video hosting not configured (TERM_PROOF_VIDEO_BUCKET / TERM_PROOF_VIDEO_BASE_URL unset) — skipping upload. Artifact remains the canonical fallback."
            exit 0
          fi
          uv run python -m termproof.evidence_publish publish-videos \
            --base-dir .termproof/pr-base \
            --head-dir .termproof/ci \
            --bucket "$TERM_PROOF_VIDEO_BUCKET" \
            --pr-number "$PR_NUMBER" \
            --run-id "$RUN_ID" \
            --video-base-url "$TERM_PROOF_VIDEO_BASE_URL" \
            --out .termproof/evidence-branch

      - name: Publish screenshot evidence branch
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          EVIDENCE_BRANCH: termproof-evidence
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ ! -d .termproof/evidence-branch/pr ]; then
            echo "No screenshot evidence to publish."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          git -C "$tmp" init
          git -C "$tmp" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$tmp" fetch --depth=1 origin "$EVIDENCE_BRANCH"; then
            git -C "$tmp" checkout "$EVIDENCE_BRANCH"
          else
            git -C "$tmp" checkout --orphan "$EVIDENCE_BRANCH"
            git -C "$tmp" rm -rf . || true
          fi
          mkdir -p "$tmp/pr"
          cp -R .termproof/evidence-branch/pr/. "$tmp/pr/"
          git -C "$tmp" add pr
          if git -C "$tmp" diff --cached --quiet; then
            echo "No screenshot evidence changes."
            exit 0
          fi
          git -C "$tmp" commit -m "Add TermProof screenshots for PR ${PR_NUMBER} run ${RUN_ID}"
          git -C "$tmp" push origin "HEAD:${EVIDENCE_BRANCH}"

      - name: Compose TUI verification report
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_LABEL: ${{ github.event.pull_request.base.sha }}
          HEAD_LABEL: ${{ github.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TERM_PROOF_VIDEO_BASE_URL: ${{ vars.TERM_PROOF_VIDEO_BASE_URL }}
        run: |
          screenshot_args=()
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [ -n "$PR_NUMBER" ]; then
            screenshot_args=(
              --screenshot-base-url
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/termproof-evidence/pr/${PR_NUMBER}/${GITHUB_RUN_ID}"
            )
          fi
          video_args=()
          if [ -n "$TERM_PROOF_VIDEO_BASE_URL" ]; then
            video_args=(
              --video-base-url
              "${TERM_PROOF_VIDEO_BASE_URL}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}"
            )
          fi
          uv run python -m termproof.ci_evidence comment \
            --base-dir .termproof/pr-base \
            --head-dir .termproof/ci \
            --out .termproof/ci-pr-comment.md \
            --run-url "$RUN_URL" \
            --base-label "$BASE_LABEL" \
            --head-label "$HEAD_LABEL" \
            "${screenshot_args[@]}" \
            "${video_args[@]}"
          {
            echo "## TermProof CI Report"
            echo
            echo "Evidence artifact: \`termproof-ci-evidence\`"
            echo "Includes: \`.termproof/ci\`, \`.termproof/pr-base\`, and the PR comment body."
            echo "Screenshot previews: \`termproof-evidence\` branch for same-repo PRs."
            echo "PR comment: before/after report in \`.termproof/ci-pr-comment.md\`"
            echo
            if [ -f .termproof/ci/latest-report.md ]; then
              cat .termproof/ci/latest-report.md
            else
              echo "No TermProof report was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: termproof-ci-evidence
          path: |
            python/.termproof/ci
            python/.termproof/pr-base
            python/.termproof/ci-pr-comment.md
          if-no-files-found: ignore

      - name: Comment TUI verification report on PR
        uses: actions/github-script@v9
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- termproof-ci-report -->';
            const body = fs.readFileSync('python/.termproof/ci-pr-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: termproof-python-dist
          path: python/dist/*

  wheel:
    name: Build and smoke-test the bundled-agg wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            smoke: native
          - target: macos-arm64
            os: macos-14
            smoke: native
          - target: macos-x86_64
            os: ubuntu-latest
            smoke: inspect
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build pinned agg and platform wheel
        # Compiles agg from a git checkout, so it reaches the network the same
        # way the `Install agg` steps do and is bounded the same way (#183).
        timeout-minutes: 25
        env:
          TERMPROOF_AGG_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/build_agg.py --target "$TERMPROOF_AGG_TARGET"
          uv build --wheel
      - name: Smoke-test installed wheel
        if: matrix.smoke == 'native'
        # `pip install` resolves the wheel's dependencies from PyPI (#183).
        timeout-minutes: 10
        run: |
          python3 -m venv .wheel-test
          .wheel-test/bin/pip install dist/*.whl
          (
            cd /tmp
            "$GITHUB_WORKSPACE/python/.wheel-test/bin/python" -c 'from termproof.agg_bundle import bundled_agg_path; p=bundled_agg_path(); assert p.is_file(); print(p)'
            "$GITHUB_WORKSPACE/python/.wheel-test/bin/termproof" --help
          )
      - name: Inspect cross-built wheel
        if: matrix.smoke == 'inspect'
        env:
          TERMPROOF_AGG_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          target = os.environ["TERMPROOF_AGG_TARGET"]
          wheel_tag = {"macos-x86_64": "macosx_10_15_x86_64"}[target]
          wheel = next(Path("dist").glob("*.whl"))
          assert wheel_tag in wheel.name, wheel
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert f"termproof/_vendor/agg/{target}/agg" in names
          assert "termproof/_vendor/agg/PROVENANCE.md" in names
          print(wheel)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: termproof-${{ matrix.target }}-wheel
          path: python/dist/*.whl
