[project]
name = "termproof"
version = "0.2.0"
description = "Evidence-first verification for TUI and terminal applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mengwei Ding" }]
keywords = ["asciinema", "terminal", "tui", "verification", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "asciinema>=2.4.0",
  "imageio-ffmpeg>=0.6.0",
  "jsonschema>=4.0",
  "pexpect>=4.9.0",
  "pillow>=10.0",
  "pyte>=0.8.2",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/md-mt/termproof"
Repository = "https://github.com/md-mt/termproof"
Issues = "https://github.com/md-mt/termproof/issues"

[project.scripts]
termproof = "termproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["termproof"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "termproof",
  "tests",
  "examples",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "examples/artifacts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
