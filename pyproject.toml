[project]
name = "tui-verifier"
version = "0.1.0"
description = "Evidence-first verification for TUI and terminal applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mengwei Ding" }]
keywords = ["asciinema", "terminal", "tui", "verification", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "asciinema>=2.4.0",
  "imageio-ffmpeg>=0.6.0",
  "pexpect>=4.9.0",
  "pyte>=0.8.2",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/md-mt/tui-verifier"
Repository = "https://github.com/md-mt/tui-verifier"
Issues = "https://github.com/md-mt/tui-verifier/issues"

[project.scripts]
tui-verify = "tui_verifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tui_verifier"]

[tool.hatch.build.targets.sdist]
include = [
  "tui_verifier",
  "tests",
  "examples",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "examples/artifacts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
