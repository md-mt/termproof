# TermProof Rust workspace manifest.
#
# This workspace is the Rust reimplementation of TermProof. The Python
# implementation at https://github.com/md-mt/termproof remains the shipped
# product and the behavioural oracle; this port is not yet a substitute for it.
#
# Policies that govern this workspace (formatting, linting, errors, tracing,
# dependencies, features, unsafe code) are documented in
# docs/engineering-baseline.md.

[workspace]
resolver = "2"
members = [
    "crates/termproof",
    "crates/termproof-cli",
    "crates/termproof-plugin-protocol",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/md-mt/termproof"
homepage = "https://github.com/md-mt/termproof"
authors = ["TermProof maintainers"]
description = "Evidence-first verification for TUI and terminal applications (Rust reimplementation)"

# Workspace-wide lint policy. Every crate inherits these via `[lints] workspace = true`.
# CI enforces `cargo clippy --all-targets --all-features -- -D warnings`, so warnings
# here are effectively denied at the gate. See docs/engineering-baseline.md.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Shared dependency pins. Crates opt in via `foo.workspace = true`.
# No dependency may be added without a documented reason in engineering-baseline.md.
# Reasons (spec §5.3, RUST-004):
# - serde / serde_json — typed data, stable JSON serialization.
# - serde_yaml — YAML recipe/config loading (JSON+YAML inputs).
# - schemars — source-to-schema generator, Draft 2020-12.
# - jsonschema — Draft 2020-12 validation.
# - thiserror — typed internal errors converted at boundaries.
# - portable-pty / vt100 — real controlling tty and terminal emulation (RUST-006).
#
# Internal crates carry both `path` and `version`. The path is what a local
# build resolves against; the version is what the published package resolves
# against on the registry. A `path`-only dependency cannot be published at all,
# and the two must be bumped together — see docs/publishing.md.
#
# A requirement here is a *floor*, not a preference: the lowest version this
# code compiles and passes the differential harnesses against. A floor written
# higher than it needs to be costs a vendoring consumer a second copy of the
# crate for nothing, so where one sits above the oldest workable version there
# is a comment naming the API that put it there (#28). The `test at the declared
# dependency floors` step in .github/workflows/rust-ci.yml runs the suite at each
# floor, so a floor that stops being true fails CI rather than rotting quietly.
#
# A ceiling costs that same copy in the other direction, and headroom does not
# buy sharing: given a range, cargo takes the top of it, not whatever version
# the consumer already has. So an upper bound written above what the code needs
# is a floor written too high, mirrored, and wants the same kind of comment
# naming what it buys (#177).
[workspace.dependencies]
termproof = { path = "crates/termproof", version = "0.4.0" }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
# 0.16 at both ends, tested at 0.16.0. `jsonschema` 0.32.1 and 0.33.0 both ask
# for `^0.16` themselves, and across the whole `>=0.32, <0.34` declared below
# those are the only versions that ask for a 0.16 at all — 0.32.0 asks `^0.15`.
# So `^0.16` is the one requirement a default build can satisfy out of
# `jsonschema`'s copy of the backtracking engine instead of standing up a
# second one, and it cannot rot while the `jsonschema` range is what it is.
#
# Nothing here needs anything above it. Measured in #177 rather than assumed:
# the workspace builds and the whole suite passes at 0.16.0, 0.16.1, 0.16.2,
# 0.17.0, 0.18.0 and 0.19.0, and both differential harnesses report the same
# parity at every one — steps 82/115 full and 113/115 verdict, assertions
# 124/147 full and 143/147 verdict. The one thing that ever needed 0.19 was a
# type annotation naming `Captures`, which gained a second generic parameter
# there and is now never named at all — `pyregex::PyRegex::captures` reads the
# groups out under inference.
#
# The ceiling is narrow because a wide one does not let a consumer *share*.
# Cargo does not unify across 0.x minors; handed a range it takes the top. The
# previous `>=0.16, <0.20` proved it on this very workspace: resolved fresh it
# put 0.16.2 *and* 0.19.0 in the lock, `jsonschema`'s and ours, and only the
# committed lockfile — written when the requirement was narrower — hid the pair
# from us. `bans.multiple-versions = "deny"` in deny.toml carries no skip for
# `fancy-regex`, so the first regeneration of that lockfile would have failed
# the security job (#177).
#
# This costs a consumer nothing, and that is a property 0.4.0 had to buy first.
# While `pyregex::compile` returned a `fancy_regex::Regex`, moving this bound
# moved which single version a consumer could name that type from — measured on
# `>=0.16, <0.20`, a consumer pinned to 0.19.0 compiled and one pinned to
# 0.16.2, 0.17.0 or 0.18.0 did not, and narrowing would merely have swapped the
# ends. No `fancy-regex` type is in the public API now, so a consumer on any
# version compiles either way; the most this requirement can cost anyone is a
# second copy in the graph, which is exactly what narrowing it removes.
fancy-regex = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# Held at 0.8, decided in #28. Not for lack of trying: 1.2.1 builds on a single
# import rename, needs no edit at any derive site, passes the whole suite, and
# even improves assertion parity 124/147 -> 126/147. It is held anyway, for two
# reasons, of which the second is the stronger.
#
# 1. `JsonSchema` is derived on `Recipe`, `CommandSpec`, `Step`, `Assertion` and
#    the config types, so the trait is part of this crate's published surface
#    and its major is a break for any consumer that names them.
#
#    This used to read "Releases here bump the patch digit only." That was
#    never a rule, only a description of the releases that had happened, and
#    this one makes it false. The rule, from docs/publishing.md, is that
#    pre-1.0 a breaking change to any public API is a *minor* bump and
#    everything else is a patch — so a `schemars` major would be permitted, at
#    the price of a minor. It is still not taken, for reason 2, which does not
#    depend on the version digit at all.
#
# 2. `preserve_order` does not mean the same thing across the majors, and the
#    difference is graph-global. In 0.8 it is `["indexmap"]`, scoped to
#    schemars' own maps. In 1.x it is `["serde_json/preserve_order"]`, which
#    switches `serde_json::Map` to insertion order for *every* crate in the
#    consumer's build. Imposing that on unrelated crates is not ours to do on a
#    consumer's behalf. It is also where both parity wins come from — Python
#    dicts preserve insertion order too — which makes them a symptom of the
#    side effect rather than a benefit of the upgrade.
#
# The bump also silently redraws the generated recipe schema: `definitions`
# becomes `$defs` with every `$ref` retargeted, `"minimum": 0.0` becomes
# `"minimum": 0`, and key order and the `required` array go from sorted to
# declaration order. The unit tests in `crates/termproof/src/schema.rs` catch
# none of it — they check `$schema`, two `required` entries and one const, and
# the fourth, added by #174, asserts on the *canonical* embedded schema, which
# a redraw of the generated one does not touch. A change of that shape passing
# green is the argument for a real drift test. The `termproof` crate vendors
# the canonical schema now — `crates/termproof/resources/`, embedded with
# `include_str!` as `schema::CANONICAL_SCHEMA_JSON` and parsed by
# `schema::load_canonical_schema` — so reaching it is no longer what is
# missing — comparing it against the generated schema is, and that remains
# parity-gate work and is not done. `crates/termproof/tests/schema_snapshot.rs`
# pins the generated schema to itself in the meantime, which is what would have
# caught the redraw above.
#
# What #28 shipped instead is the `schema` feature on the `termproof` crate: a
# consumer that does not need generation stops compiling `schemars` at all,
# which answers "every consumer with a modern schemars carries two" without
# breaking anyone's types.
schemars = { version = "0.8", features = ["preserve_order"] }
# Floor 0.32, tested at 0.32.0. 0.31 is the first version that will not build:
# `ValidationErrorKind::OneOfMultipleValid` has no `context` field there, and
# `pyschema` reads it to rank sub-errors the way Python's `best_match` does,
# which FR-017 pins down. Below 0.31 more of the same API is missing —
# `AnyOf`/`OneOfNotValid` contexts and `PrimitiveTypesBitMap::iter` at 0.29,
# `Validator::iter_errors` as well at 0.24.
jsonschema = { version = ">=0.32, <0.34" }
# 0.9, not 0.8, because `ExitStatus::signal()` is 0.9's, and
# `PtySession::exit_signal` is the published accessor that reads it.
#
# Re-checked against the 0.8.1 and 0.9.0 sources in #35, because the reason is
# not visible from the import list — all five names `pty.rs` imports do exist
# in 0.8. Building at `>=0.8, <0.10` with 0.8.1 resolved produces exactly one
# error, `pty.rs` `no method named signal ... private field, not a method`.
# Everything else the module touches is unchanged: `openpty`, `spawn_command`,
# `try_clone_reader`, `take_writer`, `resize`, `try_wait`, `kill`,
# `process_id`, `exit_code`, and the `cwd`-or-`$HOME` rule that `launch_dir`
# mirrors for #30. 0.9's other additions — `Downcast + Send` supertraits,
# `MasterPty::tty_name`, and a `sigprocmask` reset in the forked child — are
# real but nothing here relies on them.
#
# Stated honestly, this is a choice and not an impossibility. 0.8's
# `Display for ExitStatus` writes "Terminated by {name}", and scraping the name
# back out of it compiles on 0.8 and returns the identical value — verified on
# both versions, same `Some("Hangup: 1")`. It is rejected because a `Display`
# format carries no semver guarantee: if it were ever reworded, `exit_signal`
# would start answering `None` with no compile error, which is a silent wrong
# answer about how a child died. A typed accessor is worth the floor.
#
# The cost of the floor is one public method. `exit_signal` is not on the
# `Session` trait, so no execution mode and neither differential harness can
# reach it; it exists for a library consumer holding a `PtySession`, and
# `terminal::pty::tests::a_signalled_child_reports_the_signal_by_name` covers
# what that consumer sees.
#
# What enforces the floor is the call to `ExitStatus::signal()` itself, which
# does not compile on 0.8. Not that test: it asserts the *public* behaviour of
# `exit_signal`, which the `Display` scrape above satisfies just as well, so it
# passes on 0.8 too (#37). The two are worth keeping apart — the test says the
# accessor works, the typed call says which versions it works on.
portable-pty = "0.9"
vt100 = "0.16"
# 0.7, not 0.4, because 0.4 pulls quick-xml 0.31, which carries
# RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (unbounded namespace-resolver
# allocation on untrusted XML). quick-junit 0.7 builds on quick-xml 0.41,
# where both are fixed; the API surface this crate uses — `Report`,
# `TestSuite`, `TestCase`, `TestCaseStatus`, `NonSuccessKind` and the
# `set_*` builders — is unchanged across the bump (verified by the suite).
quick-junit = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
unicode-normalization = "0.1"
# Must track the major that `vt100` depends on. Our own width decisions and
# vt100's cell layout have to come from one Unicode table, or the same byte
# stream lands in a different column depending on which path read it — see the
# note on width tables in `terminal::attributed`.
#
# So this is not widenable while `vt100` is 0.16, which asks for `^0.2.1`.
# Measured in #35 rather than argued:
#
# - `>=0.1, <0.3` resolves to 0.2.2 anyway, so as a *requirement* it changes
#   nothing. As a *floor* it is a claim CI cannot honour: the floor job pins by
#   rewriting the requirement to `=<floor>`, and `=0.1.14` splits the graph into
#   `termproof -> 0.1.14` beside `vt100 0.16.2 -> 0.2.2`.
# - That split fails the suite: 369 pass, 3 fail —
#   `both_paths_measure_width_with_the_same_table` (`[2, 0, 1]` against
#   `[1, 1]`), `both_paths_place_the_following_glyph_in_the_same_column` and
#   `the_text_path_reads_the_same_width_table`, all in `terminal::attributed`.
#   So this is a correctness floor with tests behind it, not a bloat argument.
#
# One correction to how this was first written: a second copy is not what a
# lower floor would *add*. `avt` already brings 0.1.14 into any `evidence`
# build, and `attributed.rs` documents that as the one contained exception.
# What a lower floor would do is move *our* width calls onto that copy, i.e.
# onto the far side of the boundary from the `vt100` grid they have to agree
# with (#28, #35).
unicode-width = "0.2"
tempfile = "3.10"
thiserror = "2.0"
avt = "0.16"
chrono = "0.4"
globset = "0.4"
clap = { version = "4.5", features = ["derive"] }
termproof-plugin-protocol = { path = "crates/termproof-plugin-protocol", version = "0.4.0" }
