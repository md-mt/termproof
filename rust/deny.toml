# Deny policy for the workspace, enforced by `cargo deny check` in
# .github/workflows/rust-security.yml on every pull request, on push to main, and
# weekly (advisories land without a code change; the licence/bans/sources
# checks compare the graph, which a weekly run re-reads from the committed
# lockfile).
#
# Every intentional exception is documented inline with an owner and, where
# meaningful, an expiry condition. Nothing is allowed silently.

[advisories]
# cargo-deny 0.20 removed the per-severity fields: every vulnerability and
# unsound advisory now emits an error and fails the check, which is exactly
# the posture this workspace wants. What remains configurable here:
# - yanked: a lockfile pinned to a yanked version fails rather than quietly
#   shipping a release that the registry no longer stands behind.
# - ignore: an advisory that cannot be fixed yet is added here with the
#   issue that owns the decision, and removed when the fix lands.
db-path = "$CARGO_HOME/advisory-dbs"
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0449 — `unsafe-libyaml` is unmaintained. It is an
    # `unmaintained` advisory, not a vulnerability, and there is no release to
    # move to: `serde_yaml` 0.9 (itself deprecated upstream) requires
    # `unsafe-libyaml` 0.2.11, the last one. Replacing the YAML stack is a
    # behaviour migration rather than a bump — config loading goes through
    # `serde_yaml::Value` before conversion to JSON, and recipe/config parser
    # errors are user-visible — so it is owned by #276, which has to check
    # typed loading and diagnostics against the differential config harness.
    # Remove this entry when #276 takes `unsafe-libyaml` out of the lockfile.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11 is unmaintained with no successor release; required by serde_yaml 0.9. Replacing the YAML stack is a behaviour migration owned by https://github.com/md-mt/termproof/issues/276 — remove this ignore when it lands." },
]

[licenses]
# The allowlist is the union of what the graph legitimately uses, read from
# `cargo metadata` with --all-features so a feature-gated dependency cannot
# slip in unseen. Everything else is denied by default. An allowance that no
# live dependency uses anymore is removed, not kept for luck: `cargo deny
# check` warns on unused allowances, and the allowlist is meant to equal the
# live graph plus deliberate pre-approvals (none today).
#
# `ISC` and `CDLA-Permissive-2.0` entered with jsonschema 0.56 (#221),
# whose default HTTP `$ref` resolution pulls reqwest 0.13 and its rustls
# stack: `ISC` is an AND-term in ring, aws-lc-rs/aws-lc-sys, rustls-webpki
# and untrusted, and `CDLA-Permissive-2.0` is webpki-root-certs' data
# licence for the Mozilla root set. Both are permissive; they leave the
# list when that subtree does.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]

[bans]
# Multiple versions are denied — a duplicate that is not explicitly reviewed
# and skipped here fails the check. The graph deliberately carries a small
# number of documented duplicates; each one is listed in `skip` with its
# rationale, so a NEW duplicate (one not reviewed) cannot land silently.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []

# Reviewed skips for the current duplicates, one per crate. Each entry names
# the version that cannot be removed while the listed upstream dependency is
# in the graph; the surviving version is what the workspace pins or what the
# rest of the tree resolves. A skip is justified only when the dependency
# tree proves the old copy is transitive and immovable — collapsing it would
# require an upstream major bump this crate does not control.
#
# bitflags 1.3.2 — via `portable-pty 0.9.0` (our real-tty dependency,
# RUST-006). portable-pty still builds on bitflags 1.x; everything else in
# the graph (nix, rustix, png/image, tower-http/reqwest, redox_syscall)
# already uses 2.13.1. Immovable until portable-pty drops bitflags 1.x.
skip = [
    { name = "bitflags", version = "=1.3.2", reason = "portable-pty 0.9.0 pins bitflags 1.x (filedescriptor/PTY path); the rest of the tree is on 2.13.1. Collapsing requires a portable-pty major bump." },
    # hashbrown 0.12.3 — via `indexmap 1.9.3` from `schemars 0.8.22` (our
    # source-to-schema generator). schemars 0.8 pins indexmap 1.x, which
    # pins hashbrown 0.12; quick-junit/serde_yaml bring indexmap 2.14.0 /
    # hashbrown 0.17.1. Immovable while schemars 0.8 is the generator.
    { name = "hashbrown", version = "=0.12.3", reason = "schemars 0.8.22 -> indexmap 1.9.3 -> hashbrown 0.12; modern indexmap 2.14.0 (quick-junit, serde_yaml) uses 0.17. Collapsing requires a schemars major bump." },
    # indexmap 1.9.3 — the schemars 0.8 pair of the hashbrown entry above.
    # schemars 0.8.22 depends on indexmap 1.x for preserve_order; the rest of
    # the graph is on 2.14.0. Immovable while schemars 0.8 is the generator.
    { name = "indexmap", version = "=1.9.3", reason = "schemars 0.8.22 depends on indexmap 1.x (preserve_order); quick-junit and serde_yaml use 2.14.0. Collapsing requires a schemars major bump." },
    # syn 2.0.119 — the derive stack still on syn 2: schemars_derive 0.8.22,
    # serde_derive_internals, synstructure (yoke/zerofrom/zerovec ICU
    # derives), thiserror-impl 1.0.69 (via filedescriptor -> portable-pty),
    # zerocopy-derive (ahash, under jsonschema), wasm-bindgen-macro-support
    # and windows-implement/interface. The modern derive stack (serde
    # 1.0.229, thiserror 2.0.20, displaydoc, ref-cast) is on syn 3.0.3. Two
    # syn majors cannot be collapsed without upstream majors bumping their
    # proc-macro deps.
    { name = "syn", version = "=2.0.119", reason = "schemars 0.8 derive, ICU zerovec/yoke derives, thiserror-impl 1.x (portable-pty path), zerocopy-derive and wasm/windows tooling are still on syn 2; serde/thiserror 2/displaydoc/ref-cast are on syn 3. Two upstream majors, not ours to collapse." },
    # thiserror 1.0.69 — via `filedescriptor 0.8.3` from `portable-pty 0.9.0`.
    # portable-pty's PTY layer still uses thiserror 1.x; the workspace floor
    # and quick-junit are on 2.0.20. Immovable while portable-pty 0.9 is in
    # the graph.
    { name = "thiserror", version = "=1.0.69", reason = "portable-pty 0.9.0 -> filedescriptor 0.8.3 pins thiserror 1.x; workspace floor and quick-junit are on 2.0.20. Collapsing requires a portable-pty major bump." },
    # thiserror-impl 1.0.69 — the proc-macro companion of thiserror 1.0.69
    # (same portable-pty/filedescriptor path). Skipped with its parent.
    { name = "thiserror-impl", version = "=1.0.69", reason = "proc-macro companion of thiserror 1.0.69, pulled by the same portable-pty -> filedescriptor path." },
    # unicode-width 0.1.14 — via `avt 0.18.0` (evidence feature). Permanent
    # exception: the workspace requires 0.2 (resolved to 0.2.2), matching
    # vt100 0.18.1's ^0.2.2 (see Cargo.toml and terminal::attributed.rs).
    # avt carries its own 0.1.x copy and cannot be deduplicated by pinning.
    { name = "unicode-width", version = "=0.1.14", reason = "avt 0.18.0 brings its own unicode-width 0.1.x; workspace requirement is 0.2 (resolved to 0.2.2) tied to vt100 0.18.1's ^0.2.2 (correctness tests in terminal::attributed). Permanent, not a thing to fix." },
    # vte 0.14.1 — via `strip-ansi-escapes 0.2.1` from `quick-junit 0.8.0`
    # (junit feature). vt100 0.18.1 uses vte 0.15.0. Incidental: both sides
    # are transitive, neither pins the other; the quick-junit 0.7 -> 0.8 bump
    # did not move it, but a later one, or one of its strip-ansi-escapes, may
    # collapse it.
    { name = "vte", version = "=0.14.1", reason = "quick-junit 0.8.0 -> strip-ansi-escapes 0.2.1 pins vte 0.14.1; vt100 0.18.1 uses 0.15.0. Incidental transitive split; a future upstream bump may collapse it." },
    # The five below entered together with jsonschema 0.56 (#221).
    # At 0.60.1, HTTPS `$ref` resolution still uses reqwest 0.13.5 and
    # rustls. Verified with `cargo tree -i <crate>@<ver> --all-features
    # -e normal,build`, adding `--target all` for platform/build paths.
    # Retain the skips, including ring's optional lockfile-only copies.
    #
    # base64 0.22.1 — same path at jsonschema 0.60.1: reqwest 0.13.5 ->
    # hyper-util 0.1.20 (also through hyper-rustls). reqwest itself uses
    # 0.23.1, so the pair exists inside one upstream stack.
    { name = "base64", version = "=0.22.1", reason = "Entered with jsonschema 0.56 (#221); same path at 0.60.1: reqwest 0.13.5 -> hyper-util 0.1.20 pins base64 0.22; reqwest itself uses 0.23.1. Collapsing requires hyper-util to move." },
    # getrandom 0.2.17 — retained in Cargo.lock through rustls-webpki's
    # optional ring 0.17.14 dependency. At jsonschema 0.60.1, cargo tree
    # reports no active path, even with --target all; rustls uses aws-lc-rs.
    # The active mainline copy is 0.3.4 (ahash, tempfile, referencing).
    { name = "getrandom", version = "=0.2.17", reason = "Entered with jsonschema 0.56 (#221); at 0.60.1 retained only in the lockfile via rustls-webpki -> optional ring 0.17.14 -> getrandom 0.2, with no active all-features/all-targets path. Mainline uses 0.3.4." },
    # getrandom 0.4.3 — visible with --target all at jsonschema 0.60.1:
    # reqwest 0.13.5 -> rustls -> aws-lc-rs -> aws-lc-sys builds ->
    # cc 1.4.0 (also through cmake) -> jobserver 0.1.35. cc also has a
    # chrono -> iana-time-zone -> iana-time-zone-haiku build path.
    { name = "getrandom", version = "=0.4.3", reason = "Entered with jsonschema 0.56 (#221); same aws-lc build path at 0.60.1: reqwest 0.13.5 -> rustls -> aws-lc-rs -> aws-lc-sys builds -> cc 1.4.0 -> jobserver 0.1.35 -> getrandom 0.4 (also a chrono/Haiku build path). Mainline uses 0.3.4." },
    # r-efi 6.0.0 — the getrandom 0.4 pair above, visible with --target all
    # at jsonschema 0.60.1. Mainline getrandom 0.3.4 uses r-efi 5.3.0.
    { name = "r-efi", version = "=6.0.0", reason = "Entered with jsonschema 0.56 (#221); same path at 0.60.1: companion of getrandom 0.4.3 (jobserver build chain, above); mainline getrandom 0.3.4 uses r-efi 5.3.0." },
    # windows-sys 0.52.0 — retained only through optional ring 0.17.14
    # in Cargo.lock at jsonschema 0.60.1. cargo tree reports no active path
    # even with --target all. Active Windows consumers use 0.61.2.
    { name = "windows-sys", version = "=0.52.0", reason = "Entered with jsonschema 0.56 (#221); at 0.60.1 retained only in the lockfile via rustls-webpki -> optional ring 0.17.14 -> windows-sys 0.52, with no active all-features/all-targets path. Active Windows consumers use 0.61.2." },
]

skip-tree = []

[sources]
# crates.io only. A git or alternate-registry dependency needs a deliberate
# allow entry here plus a reason in docs/engineering-baseline.md — the
# supply-chain posture is that nothing outside the public registry is trusted.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
