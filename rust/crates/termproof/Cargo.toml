[package]
name = "termproof"
description = "Evidence-first verification for TUI and terminal applications: recipe model, schema, steps, assertions, orchestration, terminal sessions and the evidence pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/termproof"
# crates.io caps both lists at five, so these are the union of what the three
# merged crates carried, trimmed to the five that describe the whole library
# rather than any one former crate.
keywords = ["terminal", "tui", "testing", "verification", "pty"]
categories = [
    "development-tools::testing",
    "development-tools",
    "command-line-interface",
    "os::unix-apis",
    "visualization",
]
# The differential tests replay `conformance/corpus/`, which lives at the repository
# root and is deliberately not shipped (~150 KB of recorded oracle output that no
# consumer of the library needs). Without the corpus these two tests cannot run,
# so they stay out of the tarball too. Every other test here is self-contained.
exclude = [
    "tests/differential_steps.rs",
    "tests/differential_assertions.rs",
]

# Features gate public modules, so `docs.rs` must build with all of them on or
# the published documentation silently loses `evidence` and `validation`.
[package.metadata.docs.rs]
all-features = true

# Two waived semver lints, and the reason each is waived rather than fixed.
#
# Both are 0.4.x decisions by the captain, both leave `CHANGELOG.md` describing
# the break in full, and both are bounded the same way: a test that pins the
# affected struct's field list, recovering for that struct the cover the lint
# gave the whole crate, plus a test that expires the waiver when the version
# leaves the line it was granted for.
#
# ## `constructible_struct_adds_field` (#196)
#
# `EvidencePublisher` gained a fifth public field, `video_converter`, and every
# field of it is `pub` with no `#[non_exhaustive]`, so an external crate writing
# `EvidencePublisher { dir, identity, renderer, uploader }` stopped compiling
# (#196). Under the pre-1.0 rule in `docs/publishing.md` that is a minor bump.
# The captain's decision on #196 is that termproof stays on 0.4.x and this
# break is waived, so the lint is turned off here rather than the version being
# moved or the job being disabled — `CHANGELOG.md` still describes the break in
# full under `Rust — Changed (breaking)`, because a waiver is a decision about
# the version and not a claim that nothing broke.
#
# **This is the tool's own scoped mechanism and it is scoped to a lint, not to a
# struct.** cargo-semver-checks has no per-item allow, so while this line is
# here a new `pub` field on *any* exhaustively-constructible public struct in
# the crate passes CI unremarked. Two things bound that:
#
#   - `every_public_field_of_the_publisher_is_accounted_for` in
#     `evidence::collector` pins `EvidencePublisher`'s field list, so the struct
#     this waiver was granted for cannot grow another field silently;
#   - the waiver is scoped in time to 0.4.x, and
#     `the_semver_waiver_is_scoped_to_the_release_it_was_granted_for` fails the
#     build when the version leaves that line, which is when the decision that
#     justified it expires.
#
# Delete both this entry and those two tests together, or neither.
#
# ## `struct_pub_field_missing` (#199)
#
# `Recipe`'s seven descriptive fields — `name`, `description`, `intent`,
# `priority`, `execution`, `determinism`, `ci_paths` — moved into a `RecipeMeta`
# that `Recipe` holds and flattens, so `recipe.name` is `recipe.meta.name`.
# Nothing moved on the wire: the serialised text and the generated JSON Schema
# are byte-identical, and `tests/recipe_meta.rs` pins both against the pre-split
# tree. The break is to Rust source only, and the captain's decision on #199 is
# the same as on #196 — 0.4.x stands, the break is waived.
#
# Scoped to a lint, not to a struct, with the same consequence: while this line
# is here, a `pub` field disappearing from *any* public struct in the crate
# passes CI unremarked. Bounded the same way:
#
#   - `every_public_field_of_the_recipe_is_accounted_for` in `recipe` names
#     every field of `Recipe` in an exhaustive literal, so a field of the struct
#     this waiver was granted for cannot go — or arrive — silently;
#   - `the_recipe_semver_waiver_is_scoped_to_the_release_it_was_granted_for`
#     fails the build when the version leaves 0.4.x.
#
# Note this entry also covers the `Recipe.meta` finding under
# `constructible_struct_adds_field` above; the exhaustive literal is what holds
# both, which is why one test serves both lints for this struct.
#
# Delete this entry and those two tests together, or neither.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
struct_pub_field_missing = "allow"

[lints]
workspace = true

# Feature names carry a one-line description and the issue that justifies them
# (docs/engineering-baseline.md §7). The first four are default-on, so no
# consumer sees a change by not asking for one. `evidence` and `json-schema`
# are from #27: every consumer used to compile all 18 dependencies whether or
# not it used them. `schema` is from #28, `junit` from #34, `clap` from #197.
#
# There is deliberately no `terminal`/`core` split. `terminal` is the base layer
# the crate root is built on — `recipe`, `steps`, `runner`, `execution` and
# `build_info` all depend on it, and nothing in `terminal` depends on the root —
# so a build without it is not the crate. It would also save no dependency:
# `portable-pty` and `vt100` are needed by any build that drives a terminal,
# which is every build.
[features]
default = ["evidence", "junit", "json-schema", "schema"]

# The evidence pipeline: stills, video, Markdown reports, baselines, visual
# diff and upload. Gates the whole `evidence` module (#27).
evidence = ["dep:image", "dep:avt"]

# JUnit XML reports: the `junit` module and the `generate_junit` re-exports in
# `evidence` (#34).
#
# #34 proposed `junit = ["evidence", "dep:quick-junit"]`, and the code says the
# implication is not needed. `generate_junit` takes a `&[RunResult]` and reads
# nothing else — no renderer, no collector, no artifact of any kind; the
# `artifacts` map it prints is a `BTreeMap<String, String>` on `RunResult` that
# a caller can populate without this crate's evidence layer at all. So the
# function moved to a root `junit` module and this feature stands alone, which
# also makes `junit` on its own cost `quick-junit` and nothing else instead of
# `image` and `avt` as well. `evidence::report::generate_junit` and
# `evidence::generate_junit` are kept as re-exports, so every path that
# resolved at 0.3.1 still resolves under `default`.
junit = ["dep:quick-junit"]

# JSON Schema *validation*: recipe validation and the `json_schema` built-in
# assertion. Implies `schema`, because validating a recipe means validating it
# against the schema `schema` generates — there is no other source for it (#27).
json-schema = ["dep:jsonschema", "schema"]

# JSON Schema *generation*: the `schema` module, and the derived `JsonSchema`
# impls on `Recipe`, `Config` and the types they contain.
#
# #27 left this unconditional and said why: four crates against `json-schema`'s
# 87. That arithmetic is still right and is not why this feature exists. It
# exists because `schemars` is the one dependency that reaches this crate's
# public API — the derives put `JsonSchema` on published types — so a consumer
# on `schemars` 1.x cannot deduplicate by pinning the way it can for every other
# entry in the workspace manifest. It has to carry both majors. Off, this crate
# does not name `schemars` at all and that second copy is simply gone, which is
# an answer we can give without a breaking change to the types (#28).
#
# The cost is real and was correctly called invasive when it was a side quest:
# seven `cfg_attr` derives and fifteen `cfg_attr` helper attributes in
# `recipe.rs` and `config.rs`, because `#[schemars(...)]` is an inert attribute
# the derive registers and will not compile without it.
schema = ["dep:schemars"]

# The `run_config::cli` layer: a `clap::Command` carrying the standard flags for
# `RunConfig`, and the parse back into one with the `pick()` precedence applied
# (#197).
#
# Off by default, unlike the other four, and the difference is deliberate. The
# other four subtract from a shape that has always been published, so default-on
# is what keeps them from being a break. This one adds a shape that has never
# been published, so default-off is what keeps *it* from being a change: a
# consumer that drives `RunConfig` from its own parser, or from a file alone,
# does not compile `clap` for a layer it will not call. A consumer that wants it
# names it, which is also the only way an opt-in dependency can be honest about
# who is paying for it.
clap = ["dep:clap"]

# The union of what termproof-core, termproof-terminal and termproof-evidence
# each declared, minus `ab_glyph`, which no code ever referenced (#27).
# `tempfile` was a dev-dependency of termproof-terminal and a regular dependency
# of the other two, so the regular dependency subsumes it.
[dependencies]
avt = { workspace = true, optional = true }
chrono.workspace = true
clap = { workspace = true, optional = true }
fancy-regex.workspace = true
globset.workspace = true
image = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
portable-pty.workspace = true
quick-junit = { workspace = true, optional = true }
regex.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
unicode-width.workspace = true
vt100.workspace = true
