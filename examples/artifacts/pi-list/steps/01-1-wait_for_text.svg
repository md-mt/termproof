<svg xmlns="http://www.w3.org/2000/svg" width="936" height="276" viewBox="0 0 936 276">
<rect width="100%" height="100%" fill="#101418"/>
<style>text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3;white-space:pre}</style>
<text x="18" y="38">Usage:</text>
<text x="18" y="58">  pi list [--approve|--no-approve]</text>
<text x="18" y="78"></text>
<text x="18" y="98">List installed packages from user and project settings.</text>
<text x="18" y="118"></text>
<text x="18" y="138">Options:</text>
<text x="18" y="158">  -a, --approve      Trust project-local files for this command</text>
<text x="18" y="178">  -na, --no-approve  Ignore project-local files for this command</text>
</svg>
